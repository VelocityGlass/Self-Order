<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Table Order</title>

  <!-- PWA & Mobile WebApp Capabilities -->
  <meta name="theme-color" content="#0ba17b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <iframe
    id="appFrame"
    src=""
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write; payment; fullscreen"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-top-navigation-by-user-activation">
  </iframe>

  <script>
    (function() {
      // 1. URL WebApp Apps Script Exec Anda
      var GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbyA6bJBJqtCj5bF0ZxUy-NynnH_X1AIZQhO6ZxNvrGNqQV0UoGxHWVW-GOSMb3mRzZT/exec";

      var fullUrl = window.location.href;

      // 2. Ekstraksi Cabang & Meja yang fleksibel (mendukung format ?Cilegon PCI?meja=08 atau ?cabang=Cilegon PCI&meja=08)
      var branchDetected = "";
      var tableDetected = "";

      // Pola A: URL menggunakan tanda tanya ganda atau query param custom
      // Contoh: ?Cilegon PCI?meja=08 atau ?Cilegon%20PCI?meja=08
      var searchPart = window.location.search || "";
      if (searchPart.startsWith("?")) {
        var querySegments = searchPart.substring(1).split(/[?&]/);
        querySegments.forEach(function(segment) {
          if (!segment) return;
          var decodedSegment = decodeURIComponent(segment.replace(/\+/g, " "));

          // Cek jika bagian ini adalah meja
          var tableMatch = decodedSegment.match(/^(?:meja|table|m)=(.*)$/i);
          if (tableMatch) {
            tableDetected = tableMatch[1].trim();
            return;
          }

          // Cek jika eksplisit cabang=...
          var branchMatch = decodedSegment.match(/^(?:cabang|branch|outlet)=(.*)$/i);
          if (branchMatch) {
            branchDetected = branchMatch[1].trim();
            return;
          }

          // Jika segmen tidak mengandung '=', kemungkinan besar ini nama cabang langsung (misal: "Cilegon PCI")
          if (decodedSegment.indexOf('=') === -1 && !branchDetected) {
            branchDetected = decodedSegment.trim();
          }
        });
      }

      // Dukungan format hash (#Cilegon PCI#meja=08 atau sejenisnya)
      if (window.location.hash) {
        var hashSegments = window.location.hash.substring(1).split(/[#&?]/);
        hashSegments.forEach(function(seg) {
          if (!seg) return;
          var dec = decodeURIComponent(seg.replace(/\+/g, " "));
          var tMatch = dec.match(/^(?:meja|table|m)=(.*)$/i);
          if (tMatch) tableDetected = tMatch[1].trim();
          else if (/^\d+$/.test(dec) && !tableDetected) tableDetected = dec;
          else if (dec.indexOf('=') === -1 && !branchDetected) branchDetected = dec.trim();
        });
      }

      // Default jika kosong
      var finalTable = tableDetected ? tableDetected : '01';
      var formattedTable = /^\d+$/.test(finalTable) ? ('Meja ' + finalTable.padStart(2, '0')) : finalTable;

      // 3. Susun URL target ke Google Apps Script
      var gasUrlObj = new URL(GAS_EXEC_URL);
      gasUrlObj.searchParams.set('meja', finalTable);
      if (branchDetected) {
        gasUrlObj.searchParams.set('cabang', branchDetected);
      }

      var targetSrc = gasUrlObj.toString();

      // 4. Set src iframe & kirim pesan postMessage
      var iframe = document.getElementById('appFrame');
      if (iframe) {
        iframe.src = targetSrc;

        iframe.onload = function() {
          try {
            iframe.contentWindow.postMessage({
              meja: formattedTable,
              table: formattedTable,
              cabang: branchDetected
            }, '*');
          } catch (e) {}
        };
      }
    })();
  </script>
</body>
</html>
